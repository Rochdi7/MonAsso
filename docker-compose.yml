version: "3.9"
services:
  app:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: monasso
      MYSQL_USER: monasso
      MYSQL_PASSWORD: monasso
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql-data:
