version: "3.9"
services:
  app:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/storage
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: monasso
      MYSQL_USER: monasso
      MYSQL_PASSWORD: monasso
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    expose:
      - "80"
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.php"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql-data:
