services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-MonAsso}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://villas.rcmasters.com.br}
      APP_KEY: ${APP_KEY:?APP_KEY nao definida nas variaveis do Coolify}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-monasso}
      DB_USERNAME: ${DB_USERNAME:-monasso}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD nao definida nas variaveis do Coolify}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      CACHE_STORE: ${CACHE_STORE:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
    volumes:
      - storage-data:/var/www/storage
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: monasso
      MYSQL_USER: monasso
      MYSQL_PASSWORD: monasso
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    expose:
      - "80"
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.php"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:
  storage-data:
